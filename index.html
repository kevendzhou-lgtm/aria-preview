<!doctype html><html><head><meta charset="utf-8"><meta name="robots" content="noindex,nofollow">
<meta name="viewport" content="width=device-width,initial-scale=1"><title>Private</title>
<style>body{font:15px system-ui;background:#111;color:#aaa;display:grid;place-items:center;height:100vh;margin:0}</style></head>
<body><p id="m">Loading…</p><script>
window.onhashchange=()=>location.reload();
(async()=>{const m=document.getElementById('m');try{
 const k=location.hash.slice(1); if(!k){m.textContent='Private page.';return}
 const raw=Uint8Array.from(atob(k.replace(/-/g,'+').replace(/_/g,'/')),c=>c.charCodeAt(0));
 const key=await crypto.subtle.importKey('raw',raw,'AES-GCM',false,['decrypt']);
 const buf=new Uint8Array(await (await fetch('site.bin',{cache:'no-store'})).arrayBuffer());
 const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:buf.slice(0,12)},key,buf.slice(12));
 const d=JSON.parse(new TextDecoder().decode(pt)); let h=d.html;
 const types={jpg:'image/jpeg',png:'image/png',mp4:'video/mp4',json:'application/json'};
 for(const [p,b64] of Object.entries(d.files)){const bin=Uint8Array.from(atob(b64),c=>c.charCodeAt(0));
  const u=URL.createObjectURL(new Blob([bin],{type:types[p.split('.').pop()]})); h=h.split(p).join(u);}
 document.open();document.write(h);document.close();
}catch(e){m.textContent='Private page.'}})();
</script></body></html>
